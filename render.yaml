# Render Blueprint: New > Blueprint > pick this repo. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: pengu-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CONTENT_DIR
        value: ../content
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: LLM_FALLBACK_MODEL
        value: poolside/laguna-xs-2.1:free
      - key: LLM_DAILY_CAP
        value: "45"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "56844"
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
